  <script>
    (() => {
      const tl = gsap.timeline({ paused: true });
      const B = 120, topY = 738;
      const CX = [170, 350, 510, 625, 750, 920];
      const cx = (i) => CX[i] - B / 2;
      const hops = [0.45, 0.95, 1.45, 1.95, 2.45];
      const pal = ["#ff6b2c", "#2d4bff", "#ff5fa2", "#2ee6a6", "#ffb703"];
      let seed = 11;
      const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
      const fx = document.getElementById("h-fx");
      const burst = (x, y, t, n, spread) => {
        for (let k = 0; k < n; k++) {
          const p = document.createElement("div");
          p.className = "cf";
          p.style.background = pal[k % pal.length];
          p.style.borderRadius = k % 3 === 0 ? "50%" : k % 3 === 1 ? "4px" : "0";
          if (k % 3 === 2) p.style.height = "10px";
          fx.appendChild(p);
          const a = -Math.PI * (0.1 + 0.8 * (k / (n - 1))) + (rnd() - 0.5) * 0.3;
          const r = spread * (0.6 + rnd() * 0.6);
          tl.fromTo(p, { x, y, scale: 0.4, rotation: 0, opacity: 1 }, { x: x + Math.cos(a) * r, y: y + Math.sin(a) * r, scale: 1, rotation: 200 + rnd() * 300, duration: 0.55, ease: "power3.out" }, t);
          tl.to(p, { y: "+=90", opacity: 0, duration: 0.4, ease: "power1.in" }, t + 0.5);
        }
      };
      tl.fromTo("#h-grid", { x: 0, y: 0 }, { x: -56, y: -112, duration: 3.6, ease: "none" }, 0);
      tl.fromTo(["#h-d1", "#h-d2", "#h-d3"], { scale: 0.85 }, { scale: 1.05, duration: 3.6, ease: "sine.inOut" }, 0);
      tl.fromTo("#h-title .w", { y: 0 }, { keyframes: { y: [0, -16, 0] }, duration: 0.4, stagger: 0.12, ease: "sine.inOut", immediateRender: false }, 0.1);
      // the ball's path, reused for its motion-trail ghosts
      const path = (sel, dt) => {
        tl.set(sel, { x: cx(0) - 40, y: 520 }, 0);
        tl.to(sel, { y: topY - B, duration: 0.45, ease: "power2.in" }, dt);
        tl.to(sel, { x: cx(0), duration: 0.45, ease: "none" }, dt);
        for (let i = 0; i < 4; i++) {
          const t = hops[i], n = i + 1, d = hops[n] - t;
          tl.to(sel, { x: cx(n), duration: d, ease: "none" }, t + 0.02 + dt);
          tl.to(sel, { y: topY - B - 190, duration: d / 2, ease: "power2.out" }, t + 0.02 + dt);
          tl.to(sel, { y: topY - B, duration: d / 2 - 0.02, ease: "power2.in" }, t + 0.02 + d / 2 + dt);
        }
        tl.to(sel, { y: topY - B - 260, duration: 0.28, ease: "power2.out" }, 2.6 + dt);
        tl.to(sel, { x: 750 - B / 2, y: 824 - B / 2, scale: 0.45, duration: 0.3, ease: "power2.in" }, 2.88 + dt);
        tl.to(sel, { opacity: 0, duration: 0.06 }, 3.16 + dt);
      };
      path("#h-g3", 0.09);
      path("#h-g2", 0.06);
      path("#h-g1", 0.03);
      path("#h-ball", 0);
      tl.set("#h-shadow", { x: cx(0) - 35, y: 945, scale: 0.6, opacity: 0.6 }, 0);
      tl.to("#h-shadow", { x: cx(0) + 5, scale: 1, opacity: 1, duration: 0.45, ease: "power2.in" }, 0);
      for (let i = 0; i < 5; i++) {
        const t = hops[i];
        tl.to("#h-ball", { scaleY: 0.72, scaleX: 1.24, duration: 0.06, ease: "power2.out" }, t);
        tl.to("#h-ball", { scaleY: 1.12, scaleX: 0.9, duration: 0.08, ease: "power2.out" }, t + 0.06);
        tl.to("#h-ball", { scaleY: 1, scaleX: 1, duration: 0.2, ease: "power2.out" }, t + 0.14);
        tl.fromTo("#hl" + i, { scaleY: 1, scaleX: 1 }, { scaleY: 0.82, scaleX: 1.08, duration: 0.07, ease: "power2.out", immediateRender: false }, t);
        tl.to("#hl" + i, { scaleY: 1, scaleX: 1, duration: 0.5, ease: "elastic.out(1.2, 0.35)" }, t + 0.07);
        tl.to("#hl" + i, { color: pal[i], duration: 0.12 }, t);
        burst(CX[i], topY - 10, t, 8, 150);
        if (i < 4) {
          const n = i + 1, d = hops[n] - t;
          tl.to("#h-shadow", { x: cx(n) + 5, duration: d, ease: "none" }, t + 0.02);
          tl.to("#h-shadow", { keyframes: { scale: [1, 0.6, 1], opacity: [1, 0.5, 1] }, duration: d, ease: "none" }, t + 0.02);
        }
      }
      tl.to("#hl5", { color: pal[4], duration: 0.12 }, 2.7);
      tl.to("#h-ball .eye b", { x: 4, duration: 0.2 }, 0.5);
      tl.to("#h-ball .eye b", { x: 0, y: 8, duration: 0.2 }, 2.5);
      tl.to("#h-shadow", { opacity: 0, duration: 0.2 }, 2.7);
      tl.fromTo("#h-cam", { scale: 1 }, { scale: 26, duration: 0.5, ease: "power3.in", immediateRender: false }, 3.1);
      window.__timelines["hop"] = tl;
    })();

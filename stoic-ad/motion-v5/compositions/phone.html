<template>

      <div id="p-phone">
        <div id="p-screen">
          <div class="card" id="pc0" style="left: 40px; top: 130px; width: 300px; height: 150px; background: #2ee6a6"><i></i><u style="top: 50px; width: 150px"></u><u style="top: 84px; width: 100px"></u></div>
          <div class="card" id="pc1" style="left: 260px; top: 340px; width: 236px; height: 200px; background: #ffd23f"><i></i><u style="top: 50px; width: 90px"></u><u style="top: 84px; width: 60px"></u></div>
          <div class="card" id="pc2" style="left: 40px; top: 560px; width: 260px; height: 160px; background: #ff5fa2"><i></i><u style="top: 50px; width: 110px"></u><u style="top: 84px; width: 70px"></u></div>

  <script>
    (() => {
      const tl = gsap.timeline({ paused: true });
      // the pink floods in from the portal; the phone rises into place
      tl.fromTo("#p-phone", { y: 900, rotation: 8 }, { y: 0, rotation: 0, duration: 0.7, ease: "expo.out" }, 0);
      // ball drops in from the top of the screen (coords are inside the screen)
      const pts = [[218, -120, 0.35], [190, 160, 0.75], [330, 360, 1.2], [150, 600, 1.65], [370, 420, 2.1], [218, 670, 2.55]];
      tl.set("#p-ball", { x: pts[0][0], y: pts[0][1] }, 0);
      for (let k = 1; k < pts.length; k++) {
        const [x, y, t] = pts[k];
        const t0 = pts[k - 1][2];
        tl.to("#p-ball", { x, y, duration: t - t0, ease: k === 1 ? "power2.in" : "sine.inOut" }, t0);
        tl.to("#p-ball", { rotation: "+=" + (k % 2 ? 140 : -140), duration: t - t0, ease: "sine.inOut" }, t0);
      }
      // bumper hits: the card the ball touches jumps and lights up, a +1 / heart / star floats up
      [[0, 0.75], [1, 1.2], [2, 1.65], [1, 2.1]].forEach(([c, t], i) => {
        tl.to("#pc" + c, { scale: 1.08, rotation: i % 2 ? -4 : 4, duration: 0.08, ease: "power2.out" }, t);
        tl.to("#pc" + c, { scale: 1, rotation: 0, duration: 0.45, ease: "elastic.out(1.1, 0.4)" }, t + 0.08);
        if (i < 3) {
          tl.fromTo("#pp" + c, { opacity: 0, y: 0, scale: 0.6 }, { opacity: 1, y: -80, scale: 1.2, duration: 0.35, ease: "power2.out" }, t);
          tl.to("#pp" + c, { opacity: 0, duration: 0.25 }, t + 0.45);
        }
      });
      // BOOP. BOOP. on the first two hits
      tl.to("#p-word .w", { opacity: 1, duration: 0.01, stagger: 0.45 }, 0.75);
      tl.fromTo("#p-word .w", { scale: 1.5 }, { scale: 1, duration: 0.3, stagger: 0.45, ease: "back.out(3)", immediateRender: false }, 0.75);
      // the ball lands on PLAY, presses it
      tl.to("#p-ball", { x: 218, y: 735, duration: 0.25, ease: "power2.in" }, 2.55);
      tl.to("#p-play", { scale: 0.9, duration: 0.08, ease: "power2.in" }, 2.8);
      tl.to("#p-play", { scale: 1, duration: 0.2, ease: "back.out(3)" }, 2.88);
      tl.to("#p-ball", { scaleY: 0.7, scaleX: 1.25, duration: 0.08 }, 2.8);
      tl.to("#p-ball", { scaleY: 1, scaleX: 1, opacity: 0, duration: 0.15 }, 2.95);
      tl.to("#p-word", { opacity: 0, y: -40, duration: 0.2, ease: "power2.in" }, 3.0);
      // zoom through the PLAY button: its blue becomes... the next world is mint, so the button turns mint as we pass
      tl.to("#p-play", { backgroundColor: "#2ee6a6", color: "#2ee6a6", duration: 0.2 }, 3.05);
      tl.fromTo("#p-cam", { scale: 1 }, { scale: 22, duration: 0.6, ease: "power3.in", immediateRender: false }, 3.1);
      window.__timelines["phone"] = tl;
    })();
  </script>

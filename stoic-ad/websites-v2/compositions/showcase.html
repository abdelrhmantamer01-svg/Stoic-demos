  <script>
    (() => {
      const tl = gsap.timeline({ paused: true });
      const grounds = ['#D9734A', '#BFE9E4', '#17130E', '#23272F', '#FFB24D'];
      // step k brings pair k to the front; times are local seconds
      const steps = [0, 0.7, 1.35, 2.6, 3.4];
      const END = 4.35;
      const D = 0.45;

      tl.fromTo("#s-ring", { rotationY: 72 }, { rotationY: 0, duration: D, ease: "expo.out" }, 0);
      tl.fromTo("#root", { backgroundColor: "#15120f" }, { backgroundColor: grounds[0], duration: 0.3, ease: "power2.inOut" }, 0);

      steps.forEach((t, i) => {
        if (i > 0) {
          tl.fromTo("#s-ring", { rotationY: -72 * (i - 1) }, { rotationY: -72 * i, duration: D, ease: "power3.inOut", immediateRender: false }, t);
          tl.fromTo("#root", { backgroundColor: grounds[i - 1] }, { backgroundColor: grounds[i], duration: 0.28, ease: "power2.inOut", immediateRender: false }, t + 0.08);
          tl.set("#s-pair" + i, { visibility: "visible" }, t);
          tl.set("#s-pair" + (i - 1), { visibility: "hidden" }, t + D);
          // labels roll
          tl.fromTo(["#s-n" + (i - 1), "#s-l" + (i - 1)], { yPercent: 0 }, { yPercent: -110, duration: 0.18, ease: "power2.in", immediateRender: false }, t + 0.04);
        }
        tl.fromTo("#s-l" + i, { yPercent: 110, opacity: 1 }, { yPercent: 0, opacity: 1, duration: 0.32, ease: "power4.out" }, t + 0.16);
        tl.fromTo("#s-n" + i, { yPercent: 110, opacity: 1 }, { yPercent: 0, opacity: 1, duration: 0.32, ease: "power4.out" }, t + 0.22);
        // the laptop opens, the phone turns to face us
        tl.fromTo("#s-lid" + i, { rotationX: -86, transformOrigin: "50% 100%" }, { rotationX: 7, duration: 0.5, ease: "back.out(1.25)" }, t + 0.1);
        tl.fromTo("#s-phone" + i, { rotationY: 96, y: 60 }, { rotationY: -16, y: 0, duration: 0.55, ease: "power3.out" }, t + 0.16);
        // both screens scroll the real page while it is in front
        const until = (i < 4 ? steps[i + 1] : END) + 0.2;
        tl.fromTo("#s-limg" + i, { y: 0 }, { y: -230, duration: until - t - 0.35, ease: "power1.inOut" }, t + 0.35);
        tl.fromTo("#s-pimg" + i, { y: 0 }, { y: -300, duration: until - t - 0.35, ease: "power1.inOut" }, t + 0.35);
      });

      // "Every business gets its own look."
      tl.fromTo("#s-t1", { opacity: 0, filter: "blur(12px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.18, ease: "power2.out" }, 2.78);
      tl.fromTo("#s-t2", { opacity: 0, filter: "blur(12px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.18, ease: "power2.out" }, 3.3);
      tl.fromTo("#s-tag", { color: "#ffffff" }, { color: "#2b2140", duration: 0.28, ease: "power2.inOut" }, 3.48);

      // whip up into the advantages
      tl.fromTo("#s-all", { y: 0 }, { y: -1960, duration: 0.24, ease: "power3.in" }, 4.11);

      window.__timelines["showcase"] = tl;
    })();

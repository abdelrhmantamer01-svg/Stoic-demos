<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #15120f;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="24.3" data-width="1080" data-height="1920">
      <!-- scenes -->
      <div id="hook" data-composition-id="hook" data-composition-src="compositions/hook.html" data-start="0" data-duration="4.6" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="showcase" data-composition-id="showcase" data-composition-src="compositions/showcase.html" data-start="4.6" data-duration="4.35" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>

      <div id="price" data-composition-id="price" data-composition-src="compositions/price.html" data-start="17.6" data-duration="6.7" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>

      <!-- MUSIC SLOT: no track yet (the client adds music in-app, or uploads one later).

      <audio id="music" class="clip" src="assets/music/track.mp3" data-start="0" data-duration="24.3" data-track-index="9" data-volume="0.14" data-fade-in="0.3" data-fade-out="1.2"></audio>
      -->

      <!-- voice (Kokoro af_heart, speed 1.1) -->

      window.__timelines["main"] = gsap.timeline({ paused: true });

</html>

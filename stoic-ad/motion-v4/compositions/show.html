  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const L = gsap.utils.toArray("#sh-move .l");
      const BARS = gsap.utils.toArray(".sh-bar");
      gsap.set(L, { transformOrigin: "50% 80%" });
      gsap.set(BARS, { transformOrigin: "50% 100%" });
      gsap.set(".sh-ray i", { transformOrigin: "50% 100%" });
      tl.fromTo("#sh-glow", { x: 0, y: 0 }, { x: 160, y: 500, duration: 5, ease: "sine.inOut" }, 0);

      // PART 1 (beats 0-1): the gold bead detonates into a gyroscope
      tl.fromTo("#sh-dot", { scale: 0 }, { scale: 1, duration: 0.3, ease: "back.out(3)" }, 0);
      tl.fromTo(".sh-ray i", { scaleY: 0 }, { scaleY: 1, duration: 0.5, stagger: { each: 0.012, from: "random" }, ease: "expo.out" }, 0.02);
      tl.fromTo("#sh-rays", { rotation: 0 }, { rotation: 40, duration: 1.2, ease: "power1.out" }, 0);
      tl.fromTo("#sh-r1", { scale: 0, rotationX: 0 }, { scale: 1, rotationX: 540, duration: 0.62, ease: "power3.out" }, 0.02);
      tl.fromTo("#sh-r2", { scale: 0, rotationY: 0 }, { scale: 1, rotationY: -720, duration: 0.62, ease: "power3.out" }, 0.06);
      tl.fromTo("#sh-r3", { scale: 0, rotationX: 0, rotationY: 0 }, { scale: 1, rotationX: 360, rotationY: 540, duration: 0.62, ease: "power3.out" }, 0.1);
      tl.to("#sh-dot", { keyframes: { scale: [1, 1.5, 1] }, duration: 0.3, ease: "sine.inOut" }, 0.5);
      // out: rings rush past the camera
      tl.to(".sh-ring", { scale: 5, opacity: 0, filter: "blur(14px)", duration: 0.3, stagger: 0.03, ease: "power3.in" }, 0.72);
      tl.to("#sh-rays", { scale: 3, opacity: 0, duration: 0.3, ease: "power3.in" }, 0.74);
      tl.to("#sh-dot", { scale: 0, duration: 0.2, ease: "power3.in" }, 0.8);

      // PART 2 (beats 2-4): MAKE IT / MOVE — the word is a level meter, the floor is too
      tl.set("#sh-p2", { opacity: 1 }, 0.95);
      tl.fromTo("#sh-make .w", { opacity: 0, filter: "blur(10px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.14, stagger: 0.12, ease: "power2.out" }, 0.86);
      tl.fromTo(L, { scaleY: 0 }, { scaleY: 2.05, duration: 0.26, stagger: 0.035, ease: "back.out(1.5)" }, 1.0);
      tl.fromTo("#sh-p2", { y: 0 }, { keyframes: { y: [0, 22, -10, 0] }, duration: 0.3, ease: "none" }, 1.02);
      const lv = [
        [1.1, 2.05, 1.5, 1.9],
        [1.9, 1.2, 2.05, 1.0],
        [1.3, 1.8, 1.0, 2.05],
        [2.05, 2.05, 2.05, 2.05],
      ];
      [1.25, 1.5, 1.75, 2.0].forEach((t, j) => {
        L.forEach((el, i) => tl.to(el, { scaleY: lv[j][i], duration: 0.2, ease: "back.out(2)" }, t));
      });
      const bh = [0.35, 0.8, 0.5, 1, 0.6, 0.9, 0.4, 0.75, 0.55];
      tl.fromTo(BARS, { scaleY: 0 }, { scaleY: (i) => bh[i], duration: 0.25, stagger: 0.02, ease: "back.out(2)" }, 1.0);
      [1.25, 1.5, 1.75, 2.0, 2.25].forEach((t, j) => {
        tl.to(BARS, { scaleY: (i) => bh[(i + 2 * j + 3) % 9], duration: 0.2, ease: "back.out(2)" }, t);
      });
      // out: blur push down
      tl.to("#sh-p2", { y: 700, opacity: 0, filter: "blur(26px)", duration: 0.3, ease: "power3.in" }, 2.2);

      // PART 3 (beats 5-8): a cube turns one face per beat
      tl.set("#sh-p3", { opacity: 1 }, 2.42);
      tl.fromTo("#sh-we .w", { opacity: 0, filter: "blur(10px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.14, stagger: 0.12, ease: "power2.out" }, 2.44);
      tl.fromTo("#sh-rig", { scale: 0, y: -900 }, { scale: 1, y: 0, duration: 0.36, ease: "back.out(1.5)" }, 2.42);
      tl.fromTo("#sh-cube", { rotationY: 200 }, { rotationY: 0, duration: 0.5, ease: "back.out(1.4)" }, 2.42);
      tl.fromTo("#sh-shadow", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.36, ease: "power2.out" }, 2.45);
      tl.fromTo("#sh-mq", { x: 200, opacity: 0 }, { x: -700, opacity: 1, duration: 2.6, ease: "none" }, 2.42);
      [3.0, 3.5, 4.0].forEach((t, j) => {
        tl.to("#sh-cube", { rotationY: -90 * (j + 1), duration: 0.34, ease: "back.out(1.7)" }, t);
        tl.to("#sh-rig", { keyframes: { y: [0, -46, 0] }, duration: 0.34, ease: "sine.inOut" }, t);
        tl.to("#sh-shadow", { keyframes: { scale: [1, 0.8, 1] }, duration: 0.34, ease: "sine.inOut" }, t);
      });
      // beat 9: the cube spins itself down into the bead, everything blurs out
      tl.to("#sh-cube", { rotationY: -990, duration: 0.42, ease: "power2.in" }, 4.5);
      tl.to("#sh-rig", { scale: 0.08, duration: 0.42, ease: "power3.in" }, 4.5);
      tl.to(["#sh-we", "#sh-mq", "#sh-shadow"], { opacity: 0, filter: "blur(20px)", duration: 0.25, ease: "power2.in" }, 4.5);
      tl.set("#sh-out", { opacity: 1 }, 4.88);
      tl.set("#sh-rig", { opacity: 0 }, 4.9);

      window.__timelines["show"] = tl;
    })();

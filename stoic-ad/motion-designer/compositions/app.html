      const PH = "#ap-phone";

        tl.fromTo(s, { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.32, ease: "back.out(2.2)" }, 0.46 + i * 0.065);

      tl.fromTo(".ap-bar", { scaleY: 0 }, { scaleY: 1, duration: 0.4, stagger: 0.05, ease: "back.out(2)" }, 0.9);

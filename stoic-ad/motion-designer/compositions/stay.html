      tl.to(SH, { scaleX: 1, duration: 0.1 }, 3.0);
      tl.to(P, { x: 360, duration: 0.25, ease: "power1.out" }, 3.0);
      tl.to(SH, { x: 360, duration: 0.25, ease: "power1.out" }, 3.0);
      const fl = [

        tl.to(el, { y: 1500, duration: 0.65, ease: "power2.in" }, t + 0.3);

      // wall hit, arc, floor, hop home

      tl.to(D, { scaleX: 1, scaleY: 1, duration: 0.2, ease: "back.out(3)" }, 3.3);
      tl.to(P, { x: -200, duration: 0.45, ease: "none" }, 3.25);

      tl.to(P, { x: -330, duration: 0.35, ease: "none" }, 3.7);

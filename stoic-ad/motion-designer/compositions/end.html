      const T0 = 0.36;
      const DUR = 0.92;

      const X1 = 955;

        edge += adv[i] * 0.176;
        const target = Math.min(X1, edge + 34);
        let p = 0;
        for (let k = 0; k <= 400; k++) {
          p = k / 400;
          if (X0 + (X1 - X0) * rollEase(p) >= target) break;
        }
        tl.fromTo(el, { y: 170 }, { y: 0, duration: 0.42, ease: "back.out(1.9)" }, T0 + p * DUR);
      });
      // full stop
      tl.to(D, { keyframes: { scaleX: [1, 1.35, 1], scaleY: [1, 0.68, 1] }, duration: 0.3, ease: "sine.inOut" }, T0 + DUR);

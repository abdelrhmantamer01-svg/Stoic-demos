      tl.to(id + " .pdot", { scale: 1, duration: 0.28, ease: "back.out(2.4)" }, t);

        tl.to(id + " .on", { opacity: 0, duration: 0.12, ease: "power2.in" }, marks[i + 1] - 0.02);
